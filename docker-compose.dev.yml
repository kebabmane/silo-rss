services:
  app:
    build:
      context: .
      dockerfile: Dockerfile
    command: ["./bin/thrust", "./bin/rails", "server", "-b", "0.0.0.0", "-p", "3000"]
    ports:
      - "3000:3000"
    volumes:
      - bundle-cache:/usr/local/bundle
      - db-data:/rails/db
      - storage-data:/rails/storage
    environment:
      - RAILS_ENV=development
      - SECRET_KEY_BASE=${SECRET_KEY_BASE:-$(openssl rand -hex 64)}
      - RAILS_LOG_TO_STDOUT=1
      - DISABLE_SSL=1
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:3000/up"]
      interval: 30s
      timeout: 5s
      retries: 3

  worker:
    build:
      context: .
      dockerfile: Dockerfile
    command: ["./bin/rails", "solid_queue:start"]
    volumes:
      - db-data:/rails/db
      - storage-data:/rails/storage
      - bundle-cache:/usr/local/bundle
    environment:
      - RAILS_ENV=development
      - SECRET_KEY_BASE=${SECRET_KEY_BASE:-$(openssl rand -hex 64)}
      - RAILS_LOG_TO_STDOUT=1
      - DISABLE_SSL=1
    depends_on:
      - app
    restart: unless-stopped

  test:
    build:
      context: .
      dockerfile: Dockerfile
      target: build
    command: ["./bin/rails", "test"]
    volumes:
      - .:/rails
      - bundle-cache:/usr/local/bundle
    environment:
      - RAILS_ENV=test
      - SECRET_KEY_BASE=test_secret_key_base_for_testing

  console:
    build:
      context: .
      dockerfile: Dockerfile
    command: ["./bin/rails", "console"]
    stdin_open: true
    tty: true
    volumes:
      - db-data:/rails/db
      - storage-data:/rails/storage
    environment:
      - RAILS_ENV=development
      - SECRET_KEY_BASE=${SECRET_KEY_BASE:-$(openssl rand -hex 64)}

volumes:
  db-data:
  storage-data:
  bundle-cache:
