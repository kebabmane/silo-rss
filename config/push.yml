# Push Notifications Configuration
# IMPORTANT: Push notifications are OPTIONAL and disabled by default
# To enable: Set "push_notifications_enabled" to true in /admin/settings
# This configuration is only used when push notifications are enabled

shared:
  # Apple Push Notification Service (iOS)
  # Optional - only configure if you want to support iOS push notifications
  # How to set up:
  #   1. Go to Apple Developer (https://developer.apple.com/account/resources/identifiers/list)
  #   2. Create a Key for APNs with token-based authentication
  #   3. Add credentials to credentials.yml.enc:
  #      bin/rails credentials:edit
  #      action_push_native:
  #        apns:
  #          key_id: your_key_id_here
  #          encryption_key: your_private_key_here
  #   4. Fill in team_id and topic below
  apple:
    # Token auth params - See https://developer.apple.com/documentation/usernotifications/establishing-a-token-based-connection-to-apns
    key_id: <%= Rails.application.credentials.dig(:action_push_native, :apns, :key_id) %>
    encryption_key: <%= Rails.application.credentials.dig(:action_push_native, :apns, :encryption_key)&.dump %>

    # Your Apple Team ID (found at https://developer.apple.com/account/#/membership)
    team_id: your_apple_team_id

    # Your app's bundle identifier (e.g., com.example.feedreader)
    topic: your.bundle.identifier

    # Optional: Set this to the number of threads used to process notifications (default: 5)
    # connection_pool_size: 5

    # Optional: Change the request timeout in seconds (default: 30)
    # request_timeout: 60

    # Optional: Connect to APNs development server instead of production (default: false)
    # Uncomment this for development builds from Xcode
    # connect_to_development_server: true

  # Firebase Cloud Messaging (Android)
  # Optional - only configure if you want to support Android push notifications
  # How to set up:
  #   1. Create a Firebase project (https://console.firebase.google.com)
  #   2. Create a service account and download the JSON key file
  #   3. Add credentials to credentials.yml.enc:
  #      bin/rails credentials:edit
  #      action_push_native:
  #        fcm:
  #          encryption_key: |
  #            (paste entire JSON service account file here)
  #   4. Copy your project_id from the Firebase console
  google:
    # Firebase service account credentials (JSON format)
    # See https://firebase.google.com/docs/cloud-messaging/auth-server
    encryption_key: <%= Rails.application.credentials.dig(:action_push_native, :fcm, :encryption_key)&.dump %>

    # Your Firebase project ID (found in Firebase Console)
    project_id: your_project_id

    # Optional: Set this to the number of threads used to process notifications (default: 5)
    # connection_pool_size: 5

    # Optional: Change the request timeout in seconds (default: 15)
    # request_timeout: 30
