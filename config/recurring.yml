# Recurring jobs configuration for Solid Queue
development:
  refresh_all_feeds:
    class: ScheduledRefreshJob
    queue: default
    schedule: every 15 minutes
    description: "Refresh all RSS feeds every 15 minutes"

  check_daily_brief_schedules:
    class: DailyBriefSchedulerJob
    queue: default
    schedule: every 15 minutes
    description: "Check and enqueue daily brief generation jobs"

production:
  refresh_all_feeds:
    class: ScheduledRefreshJob
    queue: default
    schedule: every 15 minutes
    description: "Refresh all RSS feeds every 15 minutes"

  check_daily_brief_schedules:
    class: DailyBriefSchedulerJob
    queue: default
    schedule: every 15 minutes
    description: "Check and enqueue daily brief generation jobs"

  clear_solid_queue_finished_jobs:
    command: "SolidQueue::Job.clear_finished_in_batches(sleep_between_batches: 0.3)"
    schedule: every hour at minute 12
    description: "Clean up finished jobs from the database"
