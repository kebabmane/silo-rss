# Recurring jobs configuration for Solid Queue
development:
  refresh_all_feeds:
    class: ScheduledRefreshJob
    queue: default
    schedule: every 15 minutes
    description: "Refresh stale RSS feeds every 15 minutes"

  database_backup:
    class: DatabaseBackupJob
    queue: default
    schedule: every day at 2am
    description: "Daily SQLite database backup with 7-day retention"

production:
  refresh_all_feeds:
    class: ScheduledRefreshJob
    queue: default
    schedule: every 15 minutes
    description: "Refresh stale RSS feeds every 15 minutes"

  clear_solid_queue_finished_jobs:
    command: "SolidQueue::Job.clear_finished_in_batches(sleep_between_batches: 0.3)"
    schedule: every hour at minute 12
    description: "Clean up finished jobs from the database"

  database_backup:
    class: DatabaseBackupJob
    queue: default
    schedule: every day at 2am
    description: "Daily SQLite database backup with 7-day retention"
