# Omakase Ruby styling for Rails
inherit_gem: { rubocop-rails-omakase: rubocop.yml }

# Add complexity rules to prevent controller bloat
Metrics/MethodLength:
  Max: 20
  CountAsOne: ['array', 'hash', 'heredoc']

Metrics/ClassLength:
  Max: 150
  Exclude:
    - 'test/**/*'

Metrics/BlockLength:
  Max: 25
  Exclude:
    - 'config/**/*'
    - 'test/**/*'
