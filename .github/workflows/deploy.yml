name: Deploy

on:
  push:
    branches: [ main ]
  workflow_dispatch:

env:
  RAILS_ENV: production
  DOCKER_BUILDKIT: 1

jobs:
  # First, run all CI checks to ensure the build is safe to deploy
  security_scan:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Ruby
        uses: ruby/setup-ruby@v1
        with:
          ruby-version: .ruby-version
          bundler-cache: true

      - name: Scan for Rails security vulnerabilities
        run: bin/brakeman --no-pager

  lint:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Ruby
        uses: ruby/setup-ruby@v1
        with:
          ruby-version: .ruby-version
          bundler-cache: true

      - name: Lint code for consistent style
        run: bin/rubocop -f github

  test:
    runs-on: ubuntu-latest
    steps:
      - name: Install packages
        run: sudo apt-get update && sudo apt-get install --no-install-recommends -y build-essential git libyaml-dev pkg-config google-chrome-stable

      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Ruby
        uses: ruby/setup-ruby@v1
        with:
          ruby-version: .ruby-version
          bundler-cache: true

      - name: Run tests
        env:
          RAILS_ENV: test
        run: bin/rails db:test:prepare test

      - name: Keep screenshots from failed system tests
        uses: actions/upload-artifact@v6
        if: failure()
        with:
          name: screenshots
          path: ${{ github.workspace }}/tmp/screenshots
          if-no-files-found: ignore

  # Deploy to production using Kamal
  deploy:
    needs: [ security_scan, lint, test ]
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Ruby
        uses: ruby/setup-ruby@v1
        with:
          ruby-version: .ruby-version
          bundler-cache: true

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3
        with:
          version: latest
          buildkitd-flags: --allow-insecure-entitlement security.insecure

      - name: Create SSH directory
        run: mkdir -p ~/.ssh && chmod 700 ~/.ssh

      - name: Install SSH key
        run: |
          echo "${{ secrets.SSH_PRIVATE_KEY }}" > ~/.ssh/deploy_key
          chmod 600 ~/.ssh/deploy_key

      - name: Add server to known_hosts
        run: |
          ssh-keyscan -H ${{ secrets.DROPLET_IP || 'your-droplet-ip' }} >> ~/.ssh/known_hosts 2>/dev/null || true

      - name: Setup SSH agent
        run: |
          eval $(ssh-agent -s)
          ssh-add ~/.ssh/deploy_key

      - name: Install Kamal
        run: gem install kamal

      - name: Deploy with Kamal
        env:
          RAILS_MASTER_KEY: ${{ secrets.RAILS_MASTER_KEY }}
          KAMAL_REGISTRY_PASSWORD: ${{ secrets.KAMAL_REGISTRY_PASSWORD }}
          SSH_PRIVATE_KEY: ${{ secrets.SSH_PRIVATE_KEY }}
        run: |
          bundle exec kamal deploy

      - name: Health check
        run: |
          sleep 5
          # Check if the app is responding (replace with your actual domain)
          curl -f -s -o /dev/null -w "Health check: %{http_code}\n" \
            https://app.your-domain.com/up || true

      - name: Deployment success notification
        if: success()
        run: |
          echo "✅ Deployment successful!"
          echo "App should be live at: https://app.your-domain.com"

      - name: Deployment failure notification
        if: failure()
        run: |
          echo "❌ Deployment failed. Check the logs above for details."
          exit 1
